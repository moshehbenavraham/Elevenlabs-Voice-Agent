name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build
        env:
          CI: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

      - name: Upload build diagnostics
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: build-diagnostics
          path: |
            dist/
            *.log
            npm-debug.log*
            ~/.npm/_logs/
          retention-days: 7
          if-no-files-found: ignore

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check local LiveKit agent
        run: |
          npm ci --prefix agents/livekit
          npm run build --prefix agents/livekit
          npm test --prefix agents/livekit

      - name: Run unit tests
        run: npm run test:run
        env:
          CI: true

      - name: Upload test diagnostics
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: unit-test-diagnostics
          path: |
            test-results/
            coverage/
            *.log
            npm-debug.log*
            ~/.npm/_logs/
          retention-days: 7
          if-no-files-found: ignore
