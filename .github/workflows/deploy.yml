name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

# Prevent concurrent deployments
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Build args passed at build time (not runtime secrets)
          build-args: |
            NODE_ENV=production

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Deploy via webhook
        if: ${{ vars.DEPLOY_WEBHOOK_URL != '' }}
        run: |
          echo "Triggering deployment webhook..."
          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}" \
            -d '{"image": "${{ needs.build.outputs.image-tag }}", "sha": "${{ github.sha }}"}' \
            "${{ vars.DEPLOY_WEBHOOK_URL }}")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Response: $body"
          echo "HTTP Status: $http_code"

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "Deployment webhook failed with status $http_code"
            exit 1
          fi

          echo "Deployment triggered successfully"

      - name: Deploy via SSH (alternative)
        if: ${{ vars.DEPLOY_WEBHOOK_URL == '' && vars.DEPLOY_SSH_HOST != '' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.DEPLOY_SSH_HOST }}
          username: ${{ vars.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ vars.DEPLOY_PATH || '/opt/voice-agent' }}
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

      - name: Skip deployment (no config)
        if: ${{ vars.DEPLOY_WEBHOOK_URL == '' && vars.DEPLOY_SSH_HOST == '' }}
        run: |
          echo "::notice::No deployment configuration found. Image built and pushed to registry."
          echo "To enable deployment, configure one of:"
          echo "  - DEPLOY_WEBHOOK_URL (vars) + DEPLOY_WEBHOOK_TOKEN (secrets)"
          echo "  - DEPLOY_SSH_HOST, DEPLOY_SSH_USER (vars) + DEPLOY_SSH_KEY (secrets)"

  health-check:
    name: Post-Deploy Health Check
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ vars.HEALTH_CHECK_URL != '' }}

    steps:
      - name: Wait for deployment
        run: sleep 30

      - name: Check health endpoint
        run: |
          max_attempts=5
          attempt=1

          while [ $attempt -le $max_attempts ]; do
            echo "Health check attempt $attempt of $max_attempts..."

            response=$(curl -s -w "\n%{http_code}" "${{ vars.HEALTH_CHECK_URL }}")
            http_code=$(echo "$response" | tail -n1)
            body=$(echo "$response" | sed '$d')

            if [ "$http_code" -eq 200 ]; then
              echo "Health check passed!"
              echo "$body" | jq . || echo "$body"
              exit 0
            fi

            echo "Health check failed (HTTP $http_code), retrying in 10s..."
            sleep 10
            attempt=$((attempt + 1))
          done

          echo "Health check failed after $max_attempts attempts"
          exit 1

  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: failure()

    steps:
      - name: Create failure issue
        uses: actions/github-script@v8
        with:
          script: |
            const title = `Deployment failed for ${context.sha.substring(0, 7)}`;
            const body = `The deployment workflow failed.\n\n` +
              `**Commit:** ${context.sha}\n` +
              `**Branch:** ${context.ref}\n` +
              `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
              `Please investigate and fix the deployment.`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['bug', 'deployment']
            });
